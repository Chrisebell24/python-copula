# Publishing to PyPI, by Trusted Publishing.
#
# No API token is stored anywhere. GitHub mints a short-lived OIDC identity for
# this workflow and PyPI checks it against a publisher you configure once, so
# there is no long-lived credential to leak, rotate, or accidentally print.
#
# One-time setup, done separately on each index:
#
#   test.pypi.org/manage/account/publishing/
#   pypi.org/manage/account/publishing/
#
#     PyPI project name   rcopula
#     Owner               Chrisebell24
#     Repository name     python-copula
#     Workflow name       release.yml
#     Environment name    testpypi     (and `pypi` on the real index)
#
# The environment names matter: PyPI checks them, and GitHub lets you attach a
# manual approval to the `pypi` one so a real release cannot happen by accident.
name: release

on:
  # Dry run first. Requires this file to exist on the default branch.
  workflow_dispatch:
    inputs:
      target:
        description: Which index to publish to
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
  # A version tag publishes to the real index.
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The artefacts must come from a tree that passes its own tests. Building
      # first and testing after would let a broken build reach the index.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q -m "not slow"

      - name: Lint and type-check
        run: |
          python -m ruff check .
          python -m mypy rcopula

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      # Guard against the commonest release mistake: a tag that does not match
      # the version actually being built.
      - name: Tag and version must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$built" ]; then
            echo "tag v$tag does not match pyproject version $built" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rcopula
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rcopula
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
