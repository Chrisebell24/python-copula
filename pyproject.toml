[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcopula"
version = "0.4.0"
description = "Copula modelling in Python: a full-featured replication of R's `copula` package."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Chris Bell", email = "chris.e.bell24@gmail.com" }]
keywords = [
    "copula",
    "dependence",
    "statistics",
    "tail dependence",
    "sklar",
    "archimedean",
    "vine copula",
    "risk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mpmath>=1.3",
    "matplotlib>=3.7",
    "ruff==0.16.10",
    "mypy==2.3.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "matplotlib>=3.7",
]


[project.urls]
Homepage = "https://github.com/Chrisebell24/python-copula"
Documentation = "https://chrisebell24.github.io/python-copula/"
Repository = "https://github.com/Chrisebell24/python-copula"
Issues = "https://github.com/Chrisebell24/python-copula/issues"
Changelog = "https://github.com/Chrisebell24/python-copula/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["rcopula"]
# PEP 561 marker: tells type checkers the inline annotations are authoritative.
artifacts = ["rcopula/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["rcopula", "tests", "examples", "tools", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
# `pythonpath` keeps the suite runnable even if the editable install is
# stale, and makes `pytest` behave the same as `python -m pytest`.
pythonpath = ["."]
testpaths = ["tests", "rcopula"]
addopts = "--doctest-modules"
markers = [
    "golden: parity tests against R-generated golden fixtures",
    "slow: long-running (bootstrap / Monte-Carlo level studies)",
    "network: reaches the internet; skipped unless --run-network is passed",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = [
    "E741",   # ambiguous variable names: `l` is standard notation for lower bounds here
    "RUF002", # docstrings legitimately contain Unicode math (ψ, θ, τ, λ)
    "RUF003",
]

[tool.mypy]
packages = ["rcopula"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "pandas.*", "mpmath.*"]
ignore_missing_imports = true
